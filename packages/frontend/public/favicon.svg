<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!--
    Favicon: żeton kasynowy. Projekt nie miał żadnego logo, więc znak jest nowy;
    kolory to zmienne z src/styles/_variables.scss ($color-bg, $color-accent),
    żeby ikona trzymała paletę gry.
    Kompozycja jest celowo uboga - cztery elementy i mocny kontrast - bo favicon
    czytany jest przy 16 px, gdzie detal zlewa się w plamę.
  -->
  <rect width="64" height="64" rx="14" fill="#0d0d12" />
  <circle cx="32" cy="32" r="19" fill="#ffcc00" />
  <g fill="#0d0d12">
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(0 32 32)" />
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(60 32 32)" />
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(120 32 32)" />
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(180 32 32)" />
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(240 32 32)" />
    <rect x="29.5" y="10" width="5" height="7.5" rx="1.5" transform="rotate(300 32 32)" />
  </g>
  <circle cx="32" cy="32" r="10.5" fill="#0d0d12" />
  <circle cx="32" cy="32" r="4.75" fill="#ffcc00" />
</svg>
